name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      # @master, not @stable: upstream rebuilds @stable on top of master at every
      # master update, so a commit locked from @stable drops out of that branch's
      # history and the job fails at Set up job. Commits on master stay; Rust is
      # still the stable release current at run time.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  parser-tests:
    name: Parser & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      # @master, not @stable: see the note on the check job
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build
        run: cargo build

      - name: Test SUMMARY.md parser
        run: cargo test --bin guidebook -- parser::summary::tests --nocapture

      - name: Test frontmatter parser
        run: cargo test --bin guidebook -- parser::frontmatter::tests --nocapture

      - name: Test glossary parser
        run: cargo test --bin guidebook -- parser::glossary::tests --nocapture

      - name: Run security-specific tests
        run: cargo test --test security_test
